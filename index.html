
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
        }

        nav {
            background-color: #333;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .content {
            padding: 50px 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My page</h1>
        <p>My First HTML and CSS Project</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="content" id="home">
        <h2>Hello, Everyone!</h2>
        <p>This is my first simple website.</p>
        <button onclick="alert('Welcome to my website!')">
            Click Me
        </button>
    </div>

    <div class="content" id="about">
        <h2>About Us</h2>
        <p>We are learning website development.</p>
    </div>

    <footer id="contact">
        <p>Contact: student@example.com</p>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
